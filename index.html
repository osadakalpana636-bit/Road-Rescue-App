<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadRescue SL - Desktop Control Panel</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --color-bg-primary: #ffffff;
      --color-bg-secondary: #f8f9fa;
      --color-text-primary: #1a1a2e;
      --color-text-secondary: #6c757d;
      --color-border: #e9ecef;
      --color-danger: #e24b4a;
      --color-success: #28a745;
      --sidebar-width: 420px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--color-bg-secondary); color: var(--color-text-primary); height: 100vh; overflow: hidden; }
    
    /* Full Desktop Dashboard Layout Split Screen */
    .dashboard-wrap { display: flex; width: 100%; height: 100vh; }
    
    /* Left Navigation Sidebar Panel */
    .sidebar { width: var(--sidebar-width); height: 100%; background: var(--color-bg-primary); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 20px rgba(0,0,0,0.05); }
    
    /* Top Web Header Navbar */
    .web-header { padding: 20px; background: #1a1a2e; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand i { font-size: 24px; color: var(--color-success); }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    
    .desktop-sos-btn { background: var(--color-danger); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .desktop-sos-btn:hover { background: #c93b3a; }

    /* Content Scrolling Panel Viewports */
    .view-container { flex: 1; overflow-y: auto; background: var(--color-bg-secondary); position: relative; }
    .screen { display: none; flex-direction: column; padding: 16px; height: 100%; }
    .screen.active { display: flex; }
    
    .content-scroll { overflow-y: auto; flex: 1; padding-right: 2px; }
    .section-header { padding: 8px 4px 16px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-text-secondary); position: sticky; top: 0; background: var(--color-bg-secondary); z-index: 10; }
    
    /* Garage Cards Desktop Styling Optimization */
    .garage-card { background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
    .garage-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.05); border-color: #b7bcce; }
    .garage-card.featured { border-left: 4px solid var(--color-success); }
    .garage-top { display: flex; gap: 14px; }
    .garage-avatar { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .garage-info { flex: 1; }
    .garage-name { font-size: 16px; font-weight: 700; color: var(--color-text-primary); }
    .garage-type { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
    
    .garage-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    .badge-open { background: #eaf3de; color: #3b6d11; }
    .badge-dist { background: var(--color-bg-secondary); color: var(--color-text-secondary); border: 1px solid var(--color-border); }
    .stars { color: #EF9F27; font-size: 13px; }
    
    .garage-actions { display: flex; gap: 8px; margin-top: 14px; border-top: 1px solid var(--color-border); padding-top: 12px; }
    .btn-call, .btn-dir { flex: 1; border: none; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-call { background: var(--color-success); color: #fff; }
    .btn-dir { background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); }
    
    /* Right Side Full Screen Map Layout Layout Node Fixes */
    .map-wrapper { flex: 1; height: 100vh; position: relative; background: #e5e3df; }
    #live-map { height: 100vh !important; width: 100% !important; display: block; }
    
    /* Map Location Badge Bar overlay */
    .map-overlay-badge { position: absolute; top: 20px; left: 20px; background: rgba(26, 26, 46, 0.95); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    
    /* Detail Inner View Layout Profile styles */
    .back-btn { background: none; border: none; color: var(--color-text-secondary); cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
    .back-btn:hover { color: var(--color-text-primary); }
    .detail-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .detail-sub { font-size: 13px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; margin-bottom: 20px; }
    .detail-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-box { background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-val { font-size: 16px; font-weight: 700; }
    .stat-lbl { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 24px; }
    .service-tag { background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: 6px; padding: 10px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .service-tag i { color: var(--color-success); }
    .call-big { width: 100%; background: var(--color-success); color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(40,167,69,0.15); }

    /* SOS Interactive View Layout */
    .sos-view { text-align: center; padding: 30px 16px; background: #fdf2f2; border: 2px dashed var(--color-danger); border-radius: 12px; }
    .sos-pulse { width: 80px; height: 80px; background: rgba(226,75,74,0.15); color: var(--color-danger); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: pulse-radar 1.6s infinite ease-in-out; }
    .sos-pulse i { font-size: 36px; }
    @keyframes pulse-radar { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(226,75,74,0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(226,75,74,0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(226,74,74,0); } }
    .sos-title { font-size: 20px; font-weight: 700; color: var(--color-danger); margin-bottom: 6px; }
    .sos-sub { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 20px; line-height: 1.4; }
    .sos-info-card { background: #fff; border: 1px solid var(--color-border); padding: 14px; border-radius: 8px; text-align: left; margin-bottom: 20px; }
    .sos-cancel { background: var(--color-bg-primary); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 6px; padding: 10px 24px; font-size: 13px; font-weight: 600; cursor: pointer; }
  </style>
</head>

<div class="dashboard-wrap">

        <div class="services-grid" id="d-services"></div>
        
        <button class="call-big"><i class="ti ti-phone-call"></i> Connect with Vendor Terminal</button>
      </div>

      <div class="screen" id="screen-sos">

          <div class="sos-title">SOS Relay Triggered</div>

            <div style="font-size:14px; font-weight:700; font-family:monospace;" id="sos-live-loc">Searching Satellites...</div>
          </div>
          
          <button class="sos-cancel" onclick="showHome()">Cancel Emergency Beacon</button>
        </div>
      </div>

    </div>
  </div>
  
  <div class="map-wrapper">
    <div class="map-overlay-badge">
      <i class="ti ti-radar" style="color: var(--color-success); font-size:16px;"></i>
      <span id="current-location-txt">Awaiting Live Location Verification...</span>
    </div>
    <div id="live-map"></div>
  </div>

</div>

  'Brake Actuator Diagnostics':'ti-cpu','Suspension Bush Replacement':'ti-settings','Shock Absorber Testing':'ti-activity','Flat Towing':'ti-truck',
  'Inter-District Car Moving':'ti-truck','Low-Profile Car Towing':'ti-truck','Accident Extraction':'ti-alert-triangle','Radiator Repair':'ti-tool',
  'Belt Replacements':'ti-tool','On-site Battery Charging':'ti-battery-charging'
};

let map;
let userMarker;
let defaultLat = 6.9920; 
let defaultLon = 79.9480;

window.addEventListener('DOMContentLoaded', () => {
  initMapEngine();
  renderDynamicGarageCards();
});

// Dynamic Card Rendering Engine
function renderDynamicGarageCards() {
  const container = document.getElementById('dynamic-garage-list');
  container.innerHTML = '<div class="section-header">Nearest Emergency Garages (Colombo District)</div>';
  
  garageList.forEach((g, index) => {
    const isFirst = index === 0 ? 'featured' : '';
    const cardHtml = `
      <div class="garage-card ${isFirst}" onclick="showDetail('${g.id}')">
        <div class="garage-top">
          <div class="garage-avatar" style="background:#eaf3de">🔧</div>
          <div class="garage-info">
            <div class="garage-name">${g.name}</div>
            <div class="garage-type">${g.type} · ${g.services[0]}</div>
            <div class="garage-meta">
              <span class="badge badge-open">Open now</span>
              <span class="badge badge-dist"><i class="ti ti-map-pin"></i> ${g.dist}</span>
              <span class="stars">${g.rating}</span>
            </div>
          </div>
        </div>
        <div class="garage-actions">
          <button class="btn-call" onclick="event.stopPropagation(); window.location.href='tel:${g.phone}'"><i class="ti ti-phone"></i> Call</button>
          <button class="btn-dir" onclick="event.stopPropagation(); focusOnMap(${g.coords[0]}, ${g.coords[1]})"><i class="ti ti-navigation"></i> Track</button>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', cardHtml);
  });
}

// Map Engine & Real GPS Live Location Stream Handler
function initMapEngine() {
  // Leaflet initialization setup
  map = L.map('live-map', { zoomControl: true, attributionControl: false }).setView([defaultLat, defaultLon], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  const userIcon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div style='width:16px; height:16px; background:#28a745; border:3px solid white; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,0.3);'></div>",
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  
  userMarker = L.marker([defaultLat, defaultLon], {icon: userIcon}).addTo(map).bindPopup('<b>Default Base Location (Kadawatha Corridor)</b>').openPopup();

  // Mapping vector loops dropping all 30 points
  garageList.forEach(g => {
    const garageIcon = L.divIcon({
      className: 'garage-div-icon',
      html: `<div style='width:32px; height:32px; background:#1a1a2e; color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.2); cursor:pointer;'><i class='ti ti-tool' style='font-size:16px;'></i></div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    L.marker(g.coords, {icon: garageIcon}).addTo(map).bindPopup(`<b>${g.name}</b><br>${g.dist} away`);
  });

  // Secure Geo-location high accuracy permission tracker
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      map.setView([lat, lon], 13);
      userMarker.setLatLng([lat, lon]);
      userMarker.setPopupContent('<b>Live GPS Location Verified</b>').openPopup();
      document.getElementById('current-location-txt').textContent = "Live System Monitoring (GPS Verified)";
      document.getElementById('sos-live-loc').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    }, error => {
      console.warn("GPS access blocked/unavailable. Defaulting to system anchor node framework coordinates.");
      document.getElementById('current-location-txt').textContent = "System Core Node: Active Network Feed";
    }, { enableHighAccuracy: true, timeout: 10000 });
  }
}

function focusOnMap(lat, lon) {
  if(map) {
    map.panTo([lat, lon]);
    map.setZoom(15);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
  document.getElementById('screen-' + id).style.display = 'flex';
}

function showHome() { showScreen('home'); }
function showSOS() { showScreen('sos'); }

function showDetail(id) {
  const g = garageList.find(item => item.id === id);
  if(!g) return;

  document.getElementById('detail-name').textContent = g.name;
  document.getElementById('detail-addr').textContent = g.addr;
  document.getElementById('d-dist').textContent = g.dist;
  document.getElementById('d-eta').textContent = g.eta;
  document.getElementById('d-rating').textContent = g.rating;
  
  const svcEl = document.getElementById('d-services');
  svcEl.innerHTML = g.services.map(s => `
    <div class="service-tag"><i class="ti ${svcIcons[s] || 'ti-tool'}"></i> ${s}</div>
  `).join('');
  
  const callBtn = document.querySelector('.call-big');
  callBtn.setAttribute('onclick', `window.location.href='tel:${g.phone}'`);
  
  showScreen('detail');
  focusOnMap(g.coords[0], g.coords[1]);
}
</script>
</body>
</html>
